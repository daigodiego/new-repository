<!DOCTYPE html>
<html lang="ja">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>フィンランド旅行 2027年2月</title>
<style>
:root{--snow:#F4F6F8;--ink:#1B2A4A;--muted:#5B6782;--line:#D5DCE4;--blue:#0035AD;--red:#C8102E;--green:#007A3D;--yellow:#FFCE00;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--snow);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;font-size:16px;line-height:1.6;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
.hero{background:var(--blue);color:#fff;padding:20px 20px 16px}
.hero h1{margin:0;font-size:21px;font-weight:800}
.hero .dates{margin:2px 0 6px;font-size:14px;opacity:.85}
.sync{font-size:12px;opacity:.95;margin-bottom:8px}
.sync i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.total{font-size:42px;font-weight:800;line-height:1.1}
.total small{font-size:15px;font-weight:600;margin-left:6px;opacity:.85}
.pair{font-size:14px;opacity:.9;margin-top:4px}
.split{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:12px 0 6px;background:rgba(255,255,255,.2)}
.split .f{background:#7FD3A2}.split .e{background:var(--yellow)}
.legend{display:flex;gap:16px;font-size:13px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.stripe{display:flex;height:5px}.stripe span{flex:1}
nav{position:sticky;top:0;z-index:5;display:flex;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;padding:13px 14px;border:0;background:none;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--blue);border-bottom-color:var(--blue)}
main{max-width:640px;margin:0 auto;padding:16px 16px 70px}
section[hidden]{display:none}
h2{font-size:17px;margin:22px 0 10px}
section>h2:first-child{margin-top:4px}
.note{font-size:13px;color:var(--muted);margin-top:12px}
.btn{padding:8px 14px;border:0;border-radius:6px;background:var(--ink);color:#fff;font-weight:700;cursor:pointer}
.btn.sub{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:600}
.link{border:0;background:none;color:var(--muted);font-size:13px;cursor:pointer;padding:4px 2px;text-decoration:underline}
.field{font-size:16px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:#FAFBFC;min-width:0}
/* plan */
.overview{display:flex;gap:3px;margin:2px 0 6px}
.overview div{flex:1;text-align:center;font-size:11px;font-weight:700;padding:6px 0;border-radius:4px;color:#fff;line-height:1.25;background:var(--pc)}
.overview div span{display:block;font-weight:600}
.p-inari{--pc:var(--green)}.p-rov{--pc:var(--blue)}.p-hel{--pc:var(--red)}.p-move{--pc:#8A94A6}
.day{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--pc);border-radius:8px;padding:14px 14px 10px;margin-bottom:12px}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.date{font-size:24px;font-weight:800;line-height:1}
.date small{font-size:14px;font-weight:700;color:var(--muted);margin-left:6px}
.dnum{font-size:12px;color:var(--muted);font-weight:700;margin-top:4px}
.sleep{flex:none;font-size:13px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--pc);color:#fff;max-width:60%;text-align:right}
.dtitle{font-size:17px;font-weight:800;margin:10px 0 8px}
.ev{display:grid;grid-template-columns:60px 1fr;gap:10px;padding:7px 0;border-top:1px dashed var(--line);font-size:15px}
.ev b{font-size:16px;font-weight:800}
.ev.key b{color:var(--red)}
.go{padding:8px 0 2px;border-top:1px dashed var(--line);font-size:14px}
.chip{display:inline-block;font-size:13px;font-weight:700;padding:2px 9px;border-radius:999px;background:#E6ECF7;color:var(--blue);margin:3px 4px 0 0}
/* money */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:6px}
.modes{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.modes button{padding:8px 14px;border:0;background:var(--card);font-weight:700;color:var(--muted);cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--ink);color:#fff}
.rate{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px}
.rate input{width:70px}
.row{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:6px;padding:10px 12px;margin-bottom:8px}
.row.est{border-left-color:var(--yellow)}
.row .top{display:flex;gap:10px;align-items:center}
.row .nm{flex:1;font-weight:700;border:0;background:none;padding:2px 0;font-size:16px;min-width:0}
.row .amt{font-weight:800;white-space:nowrap}
.row .nt{width:100%;border:0;background:none;font-size:13px;color:var(--muted);padding:0}
.calc{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;font-size:14px;color:var(--muted)}
.calc .field{padding:5px 7px}
.calc input.p{width:100px}.calc input.q{width:52px}
.rfoot{display:flex;justify-content:space-between;margin-top:4px}
.sum{display:flex;justify-content:space-between;font-weight:800;font-size:18px;padding:10px 2px;border-top:2px solid var(--ink);margin-top:6px}
.sum.grand{color:var(--red);font-size:22px}
/* spots */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filters button{padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:14px;font-weight:700;cursor:pointer;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.spot{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--pc);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.spot .sh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.spot .sn{font-weight:800;font-size:16px}
.spot .sa{font-size:12px;font-weight:700;color:var(--pc);white-space:nowrap}
.spot .sd{font-size:14px;margin:4px 0 6px}
.spot .sctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.spot dl{margin:8px 0 0;font-size:14px;display:grid;grid-template-columns:72px 1fr;gap:4px 10px}
.spot dt{font-weight:700;color:var(--muted)}.spot dd{margin:0}
.addbox{background:var(--card);border:1px dashed var(--line);border-radius:8px;padding:12px;display:grid;gap:8px;margin-top:12px}
.addbox .r{display:flex;gap:8px;flex-wrap:wrap}
.addbox .r .field{flex:1}
/* split */
.sentence{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:10px;font-weight:700}
.sentence .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sentence .who label{display:flex;align-items:center;gap:6px;font-weight:600;margin-right:14px}
.sentence input[type=checkbox]{width:20px;height:20px;accent-color:var(--red)}
.pay{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.pay .pn{font-weight:700}.pay .pm{font-size:13px;color:var(--muted)}
.pay .pa{font-weight:800;text-align:right;white-space:nowrap}
.settle{display:flex;justify-content:space-between;font-size:18px;font-weight:800;padding:12px 0;border-bottom:1px solid var(--line)}
.members{display:flex;gap:8px;margin-bottom:6px}.members .field{flex:1}
/* todo */
.progress{font-size:14px;font-weight:700;margin-bottom:4px}
.pbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:6px}
.pbar div{height:100%;background:var(--green)}
.todo{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.todo input[type=checkbox]{width:22px;height:22px;margin-top:2px;accent-color:var(--green);flex:none}
.todo .tx{flex:1}
.todo .t{font-weight:700;display:block}.todo .n{font-size:13px;color:var(--muted);display:block}
.todo.done .t{text-decoration:line-through;color:var(--muted)}
/* notes */
details{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:10px}
summary{padding:13px 14px;font-weight:800;cursor:pointer}
details ul{margin:0;padding:0 16px 12px 32px;font-size:15px}
details li{margin-bottom:8px}
 .sync .link{color:#fff;font-size:12px;text-decoration:underline;opacity:1;margin-left:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;font-size:15px}
.card .r{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.card .r .field{flex:1}
.card label.l{display:block;font-weight:700;font-size:14px;margin-top:10px}
.msg{font-size:14px;margin-top:8px;min-height:1.4em}
.msg.ng{color:var(--red)}.msg.ok{color:var(--green)}
textarea.field{width:100%;min-height:90px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
</style>
</head>

  <h1>フィンランド オーロラ旅</h1>

<script>
/* ===== 接続設定と保存先(Firebase Realtime Database REST) ===== */
function getConn(){try{return JSON.parse(localStorage.getItem('trip-conn')||'null');}catch(e){return null;}}
const CONN=getConn();
const REMOTE=!!(CONN&&CONN.d&&CONN.k);
const dbBase=REMOTE?CONN.d.replace(/\/+$/,'')+'/trip/'+encodeURIComponent(CONN.k)+'/':'';
const keyName=k=>k.replace(/[^A-Za-z0-9_-]/g,'_');
window.storage={
  async get(k){
    if(!REMOTE){const v=localStorage.getItem('loc:'+k); if(v==null) throw new Error('nf'); return {key:k,value:v};}
    const r=await fetch(dbBase+keyName(k)+'.json',{cache:'no-store'});
    if(!r.ok) throw new Error('http '+r.status);
    const j=await r.json(); if(j==null) throw new Error('nf');
    return {key:k,value:j};
  },
  async set(k,v){
    if(!REMOTE){localStorage.setItem('loc:'+k,v); return {key:k,value:v};}
    const r=await fetch(dbBase+keyName(k)+'.json',{method:'PUT',body:JSON.stringify(v)});
    if(!r.ok) throw new Error('http '+r.status);
    return {key:k,value:v};
  }
};

const clone=o=>JSON.parse(JSON.stringify(o));

const yen=n=>'¥'+Math.round(n).toLocaleString('ja-JP');
const $=id=>document.getElementById(id);

/* ---------- split ---------- */
const payYen=p=>(+p.amount||0)*(p.cur==='EUR'?S.rate:1);
function settlement(){
  const n=S.members.length, bal=Array(n).fill(0);
  S.pays.forEach(p=>{const y=payYen(p),parts=p.parts.filter(i=>i<n); if(!parts.length) return; bal[p.payer]+=y; parts.forEach(i=>bal[i]-=y/parts.length);});
  const deb=bal.map((b,i)=>({i,b})).filter(x=>x.b<-0.5).sort((a,b)=>a.b-b.b), cre=bal.map((b,i)=>({i,b})).filter(x=>x.b>0.5).sort((a,b)=>b.b-a.b);
  const out=[]; let di=0,ci=0;
  while(di<deb.length&&ci<cre.length){const x=Math.min(-deb[di].b,cre[ci].b); out.push({from:deb[di].i,to:cre[ci].i,amt:x}); deb[di].b+=x; cre[ci].b-=x; if(deb[di].b>-0.5)di++; if(cre[ci].b<0.5)ci++;}
  return out;
}
function renderSplit(){
  const M=S.members, total=S.pays.reduce((a,p)=>a+payYen(p),0), st=settlement();
  $('split').innerHTML=`<h2>メンバー</h2><div class="members">${M.map((m,i)=>`<input class="field" aria-label="メンバー${i+1}" data-c="members" data-i="${i}" value="${esc(m)}">`).join('')}</div>

     <div class="r"><select class="field" id="pCur" aria-label="通貨"><option value="JPY">¥</option><option value="EUR">€</option></select><input class="field" id="pAmt" type="number" inputmode="decimal" placeholder="4,800" aria-label="金額" style="flex:1">かかった。</div>
     <button class="btn" data-act="padd" style="padding:12px">登録</button>
   </div>
   <h2>清算方法</h2>
   ${st.length?st.map(t=>`<div class="settle"><span>${esc(M[t.from])} → ${esc(M[t.to])}</span><span>${yen(Math.floor(t.amt))}</span></div>`).join(''):'<p class="note">清算は不要です。</p>'}
   <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><span class="note" style="margin:0">合計 ${yen(total)}(1人あたり ${yen(total/Math.max(M.length,1))})</span><button class="btn sub" data-act="pcopy" id="copyBtn">共有用にコピー</button></div>
   <h2>みんなの立て替え</h2>
   ${S.pays.map(p=>`<div class="pay"><div><div class="pn">${esc(p.name||'(名前なし)')}</div><div class="pm">${esc(M[p.payer])}が立て替え、${p.parts.map(i=>esc(M[i])).join('と')}で割る</div><button class="link" data-act="pdel" data-id="${p.id}">削除</button></div>
     <div class="pa">${p.cur==='EUR'?`€${(+p.amount).toLocaleString('ja-JP')}<div class="pm">${yen(payYen(p))}</div>`:yen(p.amount)}</div></div>`).join('')||'<p class="note">まだありません。</p>'}
   <p class="note">ユーロの支払いは、お金タブのレート(1ユーロ${S.rate}円)で円にして計算します。</p>`;
}

 ['生活と安全',['フィンランドのコンセントはCタイプ(230V)。変換プラグが必要。','フィンランドの水道水はそのまま飲める。','イナリは小さな村で、店やレストランが少なく、閉まるのも早め。夕食の場所は宿に確認しておく。','凍った湖の上は、自分だけで歩かずツアーで。','スノーモービルの運転には免許が必要なことが多い。日本の運転免許証を持っていく。']]
];
function renderNotes(){
  $('notes').innerHTML=NOTES.map(([h,items],i)=>`<details ${i===0?'open':''}><summary>${h}</summary><ul>${items.map(x=>`<li>${x}</li>`).join('')}</ul></details>`).join('')+
   '<p class="note">条件やルールは変わることがあります。出発前に公式情報で確認してください。</p>';
}

/* ---------- events ---------- */
const TABS=['plan','spots','money','split','todo','notes','settings'];
function gotoTab(name){
  document.querySelectorAll('#tabs button').forEach(x=>x.setAttribute('aria-selected',x.dataset.tab===name));
  TABS.forEach(id=>$(id).hidden=id!==name);
  window.scrollTo({top:document.querySelector('nav').offsetTop});
}
function normUrl(u){u=(u||'').trim(); if(!u) return ''; if(!/^https?:\/\//i.test(u)) u='https://'+u; try{return new URL(u).origin;}catch(e){return '';}}
function randKey(){const c='abcdefghijkmnpqrstuvwxyz23456789';const a=new Uint8Array(24);(window.crypto||{getRandomValues:x=>x.forEach((_,i)=>x[i]=Math.random()*256)}).getRandomValues(a);return [...a].map(x=>c[x%c.length]).join('');}
function enc(d,k){return btoa(JSON.stringify({d,k}));}
function dec(c){try{const o=JSON.parse(atob((c||'').trim())); return (o&&o.d&&o.k)?o:null;}catch(e){return null;}}
function copyText(txt,btn,label){
  const done=()=>{if(!btn)return; const o=label||btn.textContent; btn.textContent='コピーしました'; setTimeout(()=>btn.textContent=o,1500);};
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(done).catch(()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(_){} ta.remove();});
}
function msg(t,ok){const el=$('cMsg'); if(el){el.textContent=t; el.className='msg '+(ok?'ok':'ng');}}
async function connect(d,k){
  if(!d){msg('データベースのURLを入れてください');return;}
  if(!/^[A-Za-z0-9_-]{12,}$/.test(k||'')){msg('合言葉は、英数字(と-_)12文字以上にしてください。「自動で作る」が便利です');return;}
  msg('接続を確認中…',true);
  try{
    const r=await fetch(d+'/trip/'+encodeURIComponent(k)+'/ping.json',{cache:'no-store'});
    if(r.status===401||r.status===403){msg('許可されていません(HTTP '+r.status+')。Firebaseの「ルール」を貼って「公開」したか確認してください');return;}
    if(r.status===404){msg('データベースが見つかりません(HTTP 404)。URLを確認してください');return;}
    if(!r.ok){msg('接続できませんでした(HTTP '+r.status+')');return;}
  }catch(e){msg('つながりません。URLの間違いか、電波がないかもしれません');return;}
  localStorage.setItem('trip-conn',JSON.stringify({d,k}));
  msg('接続できました。再読み込みします…',true);
  setTimeout(()=>location.reload(),600);
}
function renderSettings(){
  const c=CONN&&CONN.d&&CONN.k?CONN:null;
  $('settings').innerHTML=`<h2>共有の状態</h2><div class="card" id="connState"></div>
  ${c?`<h2>接続コード(2人目に送る)</h2><div class="card">相手のスマホで「接続コードを貼る」に入れると、同じデータが見られます。LINEなど、家族だけに送ってください。
    <div class="r"><input class="field" id="cCodeOut" readonly aria-label="接続コード" value="${esc(enc(c.d,c.k))}"><button class="btn" data-act="ccopy">コピー</button></div></div>`:''}
  <h2>${c?'接続先を変える':'1人目:共有を設定する'}</h2>
  <div class="card"><label class="l" for="cUrl">① FirebaseのデータベースURL</label>
    <input class="field" id="cUrl" style="width:100%" placeholder="https://〜.firebasedatabase.app" inputmode="url" autocapitalize="off" autocorrect="off" value="${esc(c?c.d:'')}">
    <label class="l" for="cKey">② 合言葉(URLと合わせて「鍵」になります)</label>
    <div class="r"><input class="field" id="cKey" placeholder="英数字12文字以上" autocapitalize="off" autocorrect="off" value="${esc(c?c.k:'')}"><button class="btn sub" data-act="cgen">自動で作る</button></div>
    <div class="r"><button class="btn" data-act="cset" style="flex:1;padding:12px">接続して保存</button></div></div>
  <h2>2人目:接続コードを貼る</h2>
  <div class="card"><input class="field" id="cCode" style="width:100%" placeholder="接続コードを貼り付け" autocapitalize="off" autocorrect="off">
    <div class="r"><button class="btn" data-act="cpaste" style="flex:1;padding:12px">コードで接続</button></div>
    <div class="msg" id="cMsg"></div></div>
  <h2>いますぐ同期</h2><div class="card"><button class="btn sub" data-act="bsync">今すぐ同期する</button></div>
  <h2>バックアップ</h2>
  <div class="card">全データを文字にして書き出せます。メモなどに貼っておくと安心です。読み込むときは、下の欄に貼って「読み込む」。
    <textarea class="field" id="bText" aria-label="バックアップ" placeholder="ここに書き出されます"></textarea>
    <div class="r"><button class="btn sub" data-act="bexp">書き出す</button><button class="btn sub" data-act="bcopy">コピー</button><button class="btn sub" data-act="bimp">読み込む</button></div>
    <div class="msg" id="bMsg"></div></div>
  ${c?`<h2>共有をやめる</h2><div class="card">この端末の接続を外します(Firebase上のデータは消えません)。<div class="r"><button class="btn sub" data-act="cclear">この端末の接続を外す</button></div></div>`:''}
  <p class="note">この画面で入れた設定は、この端末(このアイコン)だけに保存されます。iPhoneでは、Safariとホーム画面のアイコンでデータがわかれるので、必ずホーム画面のアイコンから開いて設定してください。</p>`;
}
function renderAll(){renderHero();renderPlan();renderSpots();renderMoney();renderSplit();renderTodo();renderNotes();renderSettings();}
const COLS=['money','todos','spots','pays'];
let timer,syncing=false,again=false,pendingRender=false;
const stable=o=>JSON.stringify(o,(k,v)=>(v&&typeof v==='object'&&!Array.isArray(v))?Object.keys(v).sort().reduce((r,x)=>(r[x]=v[x],r),{}):v);
const norm=a=>stable([...a].sort((x,y)=>x.id<y.id?-1:1));
function del(col,id){S[col]=S[col].filter(x=>x.id!==id);S.tomb[id]=Date.now();}
function mergeCol(col,remote){
  const tomb=Object.assign({},remote.tomb||{});
  for(const k in S.tomb) tomb[k]=Math.max(tomb[k]||0,S.tomb[k]);
  const map={};
  [...(remote.items||[]),...S[col]].forEach(x=>{if(!map[x.id]||(x.u||0)>(map[x.id].u||0)) map[x.id]=x;});
  let items=Object.values(map).filter(x=>!(tomb[x.id]!==undefined&&tomb[x.id]>=(x.u||0)));
  if(col==='pays') items=items.map((x,i)=>[x,i]).sort((a,b)=>((b[0].u||0)-(a[0].u||0))||(a[1]-b[1])).map(x=>x[0]);
  return {items,tomb};
}
async function rget(k){
  try{const r=await window.storage.get(k,true); return JSON.parse(r.value);}
  catch(e){ if(e&&e.message==='nf') return null; throw e; }
}
async function rset(k,o){await window.storage.set(k,JSON.stringify(o),true);}
function cacheSave(){try{localStorage.setItem('trip-cache-v5',JSON.stringify(S));}catch(e){}}
function setStatus(kind,e){
  const t=new Date().toLocaleTimeString('ja-JP');
  let dot='#FFB3B3',msg='';
  if(kind==='ok'){dot='#7FD3A2';msg='2人で共有中(同期 '+t+')';}
  else if(kind==='wait'){dot='#FFCE00';msg='接続中…';}
  else if(kind==='local'){msg='共有は未設定(この端末だけに保存)';}
  else{
    const m=String((e&&e.message)||e);
    if(/http (401|403)/.test(m)) msg='共有の許可がありません。Firebaseのルールを確認してください';
    else if(/http 404/.test(m)) msg='データベースが見つかりません。設定のURLを確認してください';
    else msg='オフラインです。この端末に保存して、つながったら自動で同期します';
  }
  let html='<i style="background:'+dot+'"></i>'+msg;
  if(kind==='local') html+='<button class="link" data-tab="settings">設定する</button>';
  [$('sync'),$('connState')].forEach(el=>{if(el) el.innerHTML=html;});
}
async function syncAll(){
  if(syncing){again=true;return;}
  syncing=true;
  try{
    if(!REMOTE){setStatus('local');cacheSave();return;}
    let changed=false;
    for(const col of COLS){
      const remote=await rget(KEY+col);
      const m=mergeCol(col,remote||{items:[],tomb:{}});
      const before=norm(S[col]); S.tomb=m.tomb; S[col]=m.items;
      if(norm(m.items)!==before) changed=true;
      if(!remote||norm(remote.items||[])!==norm(m.items)||stable(remote.tomb||{})!==stable(m.tomb)) await rset(KEY+col,m);
    }
    const rc=await rget(KEY+'conf');
    if(rc){
      if((rc.u||0)>(S.cu||0)){S.rate=rc.rate;S.members=rc.members;S.cu=rc.u;changed=true;}
      else if((rc.u||0)<(S.cu||0)) await rset(KEY+'conf',{rate:S.rate,members:S.members,u:S.cu});
    }else await rset(KEY+'conf',{rate:S.rate,members:S.members,u:S.cu});
    setStatus('ok'); cacheSave();
    if(changed||pendingRender) renderIfIdle();
  }catch(e){setStatus('err',e);cacheSave();}
  finally{syncing=false; if(again){again=false;syncAll();}}
}
function renderSome(){renderHero();renderPlan();renderSpots();renderMoney();renderSplit();renderTodo();}
function renderIfIdle(){
  const a=document.activeElement;
  if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)&&a.type!=='checkbox'&&a.closest&&a.closest('main')){pendingRender=true;return;}
  pendingRender=false; renderSome();
}
document.addEventListener('focusout',()=>{if(pendingRender) setTimeout(renderIfIdle,60);});
function save(){cacheSave();clearTimeout(timer);timer=setTimeout(syncAll,500);}

document.addEventListener('input',e=>{
  const d=e.target.dataset; if(!d.c) return;
  if(d.c==='root'){S[d.f]=parseFloat(e.target.value)||0; S.cu=Date.now(); updateMoney(); save(); return;}
  if(d.c==='members'){S.members[+d.i]=e.target.value; S.cu=Date.now(); save(); return;}
  const it=S[d.c].find(x=>x.id===d.id); if(!it) return;
  it[d.f]=e.target.type==='number'?(parseFloat(e.target.value)||0):e.target.value; it.u=Date.now();
  if(d.c==='money') updateMoney();
  save();
});
document.addEventListener('change',e=>{
  const d=e.target.dataset;
  if(d.c==='spots'){renderPlan();save();}
  if(d.c==='money'&&(d.f==='cur'||d.f==='per')){updateMoney();save();}
  if(d.c==='root'){renderSplit();}
  if(d.c==='members'){renderSplit();}
  if(d.act==='tcheck'){const t=S.todos.find(x=>x.id===d.id); t.done=e.target.checked; t.u=Date.now(); renderTodo(); save();}
});
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return; const d=b.dataset;
  if(d.tab){gotoTab(d.tab);return;}
  if(d.mode){S.mode=d.mode;renderMoney();save();return;}
  if(d.filter){S.filter=d.filter;renderSpots();save();return;}
  switch(d.act){
    case 'madd':{const v=$('newMoney').value.trim(); if(!v) return; S.money.push({id:uid(),u:Date.now(),name:v,note:'',status:'est',price:0,qty:1,per:'pair',cur:'JPY'}); renderMoney(); break;}
    case 'mdel':{del('money',d.id); renderMoney(); break;}
    case 'mstatus':{const m=S.money.find(x=>x.id===d.id); m.status=m.status==='fixed'?'est':'fixed'; m.u=Date.now(); renderMoney(); break;}
    case 'sopen':{openSpots.has(d.id)?openSpots.delete(d.id):openSpots.add(d.id); renderSpots(); return;}
    case 'sdel':{del('spots',d.id); renderSpots(); renderPlan(); break;}
    case 'sadd':{const v=$('newSpotName').value.trim(); if(!v) return; S.spots.push({id:uid(),u:Date.now(),area:$('newSpotArea').value,day:'',name:v,desc:$('newSpotDesc').value.trim(),time:'',book:'',tip:''}); renderSpots(); break;}
    case 'tdel':{del('todos',d.id); renderTodo(); break;}
    case 'tadd':{const v=$('newTodo').value.trim(); if(!v) return; S.todos.push({id:uid(),u:Date.now(),g:$('newTodoG').value,t:v,n:$('newTodoN').value.trim(),done:false}); renderTodo(); break;}
    case 'padd':{const a=parseFloat($('pAmt').value); const parts=[...document.querySelectorAll('.pPart:checked')].map(x=>+x.value);
      if(!a||!parts.length){$('pAmt').focus();return;}
      S.pays.unshift({id:uid(),u:Date.now(),payer:+$('pPayer').value,parts,name:$('pName').value.trim(),cur:$('pCur').value,amount:a}); renderSplit(); break;}
    case 'pdel':{del('pays',d.id); renderSplit(); break;}
    case 'pcopy':{const txt=settlement().map(t=>`${S.members[t.from]} → ${S.members[t.to]} ${yen(Math.floor(t.amt))}`).join('\n')||'清算は不要です';
      const done=()=>{b.textContent='コピーしました';setTimeout(()=>b.textContent='共有用にコピー',1500);};
      (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(done).catch(()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(_){} ta.remove();});
      return;}
    case 'cgen':{$('cKey').value=randKey(); return;}
    case 'cset':{connect(normUrl($('cUrl').value),$('cKey').value.trim()); return;}
    case 'cpaste':{const o=dec($('cCode').value); if(!o){msg('接続コードが読み取れません。コピーし直してください');return;} connect(normUrl(o.d),o.k); return;}
    case 'ccopy':{copyText($('cCodeOut').value,b,'コピー'); return;}
    case 'cclear':{if(confirm('この端末の接続を外します。よろしいですか?')){localStorage.removeItem('trip-conn');location.reload();} return;}
    case 'bsync':{setStatus('wait'); syncAll(); return;}
    case 'bexp':{$('bText').value=JSON.stringify(S); $('bText').select(); $('bMsg').textContent='書き出しました。「コピー」で全文をコピーできます'; $('bMsg').className='msg ok'; return;}
    case 'bcopy':{if(!$('bText').value) $('bText').value=JSON.stringify(S); copyText($('bText').value,b,'コピー'); return;}
    case 'bimp':{
      try{
        const o=JSON.parse($('bText').value); if(!o||!Array.isArray(o.money)||!Array.isArray(o.todos)) throw 0;
        const now=Date.now(); COLS.forEach(c=>(o[c]||[]).forEach(x=>{x.u=now;}));
        S=Object.assign(DEFAULTS(),o,{cu:now}); renderAll(); save(); gotoTab('settings');
        $('bText').value=''; $('bMsg').textContent='読み込みました'; $('bMsg').className='msg ok';
      }catch(e){$('bMsg').textContent='読み込めません。書き出した文字をそのまま貼ってください'; $('bMsg').className='msg ng';}
      return;}
    default: return;
  }
  save();
});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const map={newMoney:'madd',newSpotName:'sadd',newSpotDesc:'sadd',newTodo:'tadd',newTodoN:'tadd',pAmt:'padd'};const a=map[e.target.id];if(a)document.querySelector(`[data-act="${a}"]`).click();});

(async function init(){
  try{const c=localStorage.getItem('trip-cache-v5'); if(c) S=Object.assign(DEFAULTS(),JSON.parse(c));}catch(e){}
  renderAll(); setStatus('wait');
  await syncAll();
  setInterval(()=>{if(!document.hidden) syncAll();},5000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden) syncAll();});
  window.addEventListener('online',syncAll);
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
